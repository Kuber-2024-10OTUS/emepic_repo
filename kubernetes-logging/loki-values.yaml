deploymentMode: SimpleScalable
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    bucketNames:
      chunks: hw9-loki-bucket
      ruler: hw9-loki-bucket
      admin: loki-sa
    type: s3
    s3:
      endpoint: storage.yandexcloud.net
      secretAccessKey: YCNi6EviNxSaNqXC0VvDzBYbI11uGUF-6EDRj_he
      accessKeyId: YCAJESa6LRXz64a5nqXWIp8dN
      s3ForcePathStyle: false
      insecure: false
  schemaConfig:
    configs:
      - from: 2025-03-07
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
read:
  replicas: 1 
  tolerations:
  - key: "node-role"
    operator: "Equal"
    value: "infra"
    effect: "NoSchedule"
  affinity: 
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role
            operator: In
            values:
            - infra
